# PRIVACY POLICY
legal.privacy.title=Política de Privacidad
legal.privacy.updated=Última actualización\: [03/08/2026]
legal.privacy.content=<h2>1. Responsable del tratamiento</h2><ul><li>Titular\: Javier Alexander Paltan Lombeida</li><li>Email de contacto\: @chocolatesexyfc.com </li><li>Web\: chocolatesexyfc.com</li></ul><h2>2. Datos que recopilamos</h2><ul><li>Al registrarte mediante Firebase Authentication\: correo electrónico y contraseña (cifrada), y cualquier otro dato que solicitemos en el registro (ej. nombre de usuario).</li><li>Al participar en encuestas/votaciones\: la opción votada, la fecha del voto y tu identificador de usuario.</li><li>Datos técnicos de navegación\: dirección IP, tipo de navegador, páginas visitadas (ver Política de Cookies).</li></ul><h2>3. Finalidad del tratamiento</h2><ul><li>Gestionar tu cuenta de usuario y permitir el acceso a la web.</li><li>Permitir la participación en encuestas y mostrar los resultados.</li><li>Enviar comunicaciones relacionadas con el servicio (ej. verificación de correo).</li><li>Mejorar la web y analizar su uso, si aplica.</li></ul><h2>4. Base legal</h2><ul><li>Ejecución del contrato / prestación del servicio (registro y uso de la web).</li><li>Consentimiento del usuario (cookies no esenciales, comunicaciones comerciales si las hubiera).</li></ul><h2>5. Destinatarios y encargados del tratamiento</h2><p>Utilizamos los siguientes proveedores para prestar el servicio, que actúan como encargados del tratamiento\:</p><ul><li><strong>Google Firebase</strong> (autenticación y base de datos Firestore) — Google LLC.</li><li><strong>Railway</strong> (alojamiento de la aplicación).</li><li><strong>Namecheap</strong> (gestión del dominio y DNS).</li></ul><p>No cedemos tus datos a terceros con fines comerciales.</p><h2>6. Transferencias internacionales</h2><p>Algunos proveedores (Google Firebase) pueden almacenar datos fuera del Espacio Económico Europeo. En ese caso se aplican garantías adecuadas conforme al RGPD (cláusulas contractuales tipo u otro mecanismo válido).</p><h2>7. Plazo de conservación</h2><p>Conservamos tus datos mientras mantengas tu cuenta activa. Si solicitas la baja, se eliminarán o anonimizarán en un plazo razonable, salvo obligación legal de conservarlos.</p><h2>8. Tus derechos</h2><p>Puedes ejercer tus derechos de acceso, rectificación, supresión, oposición, limitación del tratamiento y portabilidad escribiendo a @chocolatesexyfc.com. También puedes reclamar ante la Agencia Española de Protección de Datos (www.aepd.es) si consideras que el tratamiento no se ajusta a la normativa.</p><h2>9. Menores de edad</h2><p>Este servicio está dirigido a mayores de 12 años. Si eres menor de esa edad, necesitas el consentimiento de tus padres o tutores para usarlo.</p><h2>10. Cambios en esta política</h2><p>Podemos actualizar esta política; la fecha de "última actualización" indica la versión vigente.</p>

# COOKIES POLICY
legal.cookies.title=Política de Cookies
legal.cookies.updated=Última actualización\: [03/08/2026]
legal.cookies.content=<p>En chocolatesexyfc.com utilizamos cookies y tecnologías similares para el correcto funcionamiento de la web y, si procede, para analizar su uso.</p><h2>1. ¿Qué es una cookie?</h2><p>Un pequeño archivo que se almacena en tu navegador y permite reconocer tu dispositivo en visitas sucesivas.</p><h2>2. Cookies que utilizamos</h2><p><strong>Cookies técnicas/necesarias</strong> (no requieren consentimiento)\:</p><ul><li>Cookies de sesión de Firebase Authentication, necesarias para mantener tu sesión iniciada.</li><li>Cookies de preferencias básicas de la web (idioma, etc.), si aplica.</li></ul><ul><li>Google Analytics — nos permite conocer el número de visitas y el comportamiento de navegación.</li></ul><h2>3. Cómo gestionar las cookies</h2><p>Puedes configurar tu navegador para bloquear o eliminar cookies\:</p><ul><li><strong>Chrome</strong>\: Configuración &gt; Privacidad y seguridad &gt; Cookies</li><li><strong>Firefox</strong>\: Opciones &gt; Privacidad y seguridad</li><li><strong>Safari</strong>\: Preferencias &gt; Privacidad</li><li><strong>Edge</strong>\: Configuración &gt; Cookies y permisos del sitio</li></ul><p>Ten en cuenta que bloquear las cookies técnicas puede impedir que la web funcione correctamente (por ejemplo, no podrás mantener la sesión iniciada).</p><h2>4. Consentimiento</h2><p>Al navegar por la web y aceptar el aviso de cookies, consientes el uso de las cookies no esenciales descritas en esta política. Puedes retirar tu consentimiento en cualquier momento.</p>

# TERMS OF SERVICE
legal.terms.title=Términos de Uso
legal.terms.updated=Última actualización\: [03/08/2026]
legal.terms.content=<h2>1. Objeto</h2><p>Estas condiciones regulan el acceso y uso de la web chocolatesexyfc.com (en adelante, "la Web"), propiedad de Javier Alexander Paltan Lombeida.</p><h2>2. Descripción del servicio</h2><p>La Web ofrece seguimiento de un equipo de fútbol, calendario de partidos, estadísticas, así como encuestas y votaciones para que los usuarios registrados puedan participar (ej. "Mejor jugador de la jornada").</p><h2>3. Registro de usuario</h2><p>Para participar en las encuestas es necesario crear una cuenta con correo electrónico y contraseña. El usuario es responsable de la veracidad de los datos aportados y de la custodia de sus credenciales.</p><h2>4. Uso correcto de la Web</h2><p>El usuario se compromete a\:</p><ul><li>No utilizar la Web con fines ilícitos o contrarios a estas condiciones.</li><li>No manipular el sistema de votación (bots, cuentas múltiples, etc.).</li><li>No introducir contenido ofensivo, difamatorio o que vulnere derechos de terceros.</li></ul><h2>5. Propiedad intelectual</h2><p>Los contenidos de la Web (textos, imágenes, logotipos, diseño) son propiedad de Javier Alexander Paltan Lombeida o de terceros que han autorizado su uso, salvo indicación en contrario. Queda prohibida su reproducción sin autorización.</p><h2>6. Exclusión de responsabilidad</h2><ul><li>La Web se ofrece "tal cual". No se garantiza su disponibilidad continua ni ausencia de errores.</li><li>No nos hacemos responsables del uso indebido que los usuarios hagan de la Web ni de contenidos de terceros enlazados.</li></ul><h2>7. Baja del servicio</h2><p>El usuario puede solicitar la baja de su cuenta en cualquier momento escribiendo a @chocolatesexyfc.com.</p><h2>8. Modificación de las condiciones</h2><p>Podemos modificar estas condiciones en cualquier momento. Los cambios se publicarán en esta misma página.</p><h2>9. Legislación aplicable y jurisdicción</h2><p>Estas condiciones se rigen por la legislación española. Para cualquier controversia, las partes se someten a los juzgados y tribunales de [CIUDAD], salvo que la normativa de consumidores establezca un fuero distinto.</p><h2>10. Contacto</h2><p>Para cualquier duda sobre estas condiciones, escribe a @chocolatesexyfc.com.</p>